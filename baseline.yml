---
- name: Apply Linux baseline
  hosts: linux
  become: true

  tasks:
    - name: Install baseline packages
      ansible.builtin.package:
        name: "{{ base_packages + os_packages }}"
        state: present

    - name: Make sure time sync is running and starts on boot
      ansible.builtin.service:
        name: "{{ time_service }}"
        state: started
        enabled: true

    - name: Set the timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Create the ops admin account
      ansible.builtin.user:
        name: opsadmin
        groups: "{{ admin_group }}"
        append: true
        shell: /bin/bash

    - name: Apply SSH hardening
      ansible.builtin.template:
        src: templates/00-baseline.conf.j2
        dest: /etc/ssh/sshd_config.d/00-baseline.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: "{{ ssh_service }}"
        state: restarted
